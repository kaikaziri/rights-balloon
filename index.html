<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>権利の気球・動作確認版</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff6fb;color:#21364c;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}header{text-align:center;background:linear-gradient(135deg,#8bcde8,#d6f1f6);padding:25px 12px}h1{margin:0;font-size:28px}header p{margin:9px 0 0}main{max-width:700px;margin:auto;padding:16px}section{background:white;border:1px solid #d7e5ee;border-radius:20px;padding:18px;margin:15px 0;box-shadow:0 4px 15px #dce7ed}h2{font-size:20px;margin:0 0 12px}.hint{font-size:13px;color:#52677a;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}button{font:inherit;cursor:pointer}.right{min-height:67px;border:2px solid #b8d5e5;background:#e9f6fd;border-radius:12px;padding:9px;font-weight:600;font-size:14px;color:#23435a}.right.selected{border-color:#ef9d34;background:#fff0d5}.right.used{opacity:.35}.slot{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px dashed #a9c5d6;background:#f7fbff;border-radius:11px;margin:7px 0;padding:12px;color:#2b485f;min-height:52px}.slot b{min-width:35px}.slot.filled{border:1px solid #70b6d9;background:#e6f6ff}.actions{display:flex;gap:9px;flex-wrap:wrap}.action{background:#1977b5;color:white;border:0;border-radius:10px;padding:13px 17px;font-weight:bold}.secondary{background:#e6eef5;color:#31526a}#status{font-weight:600;color:#225a7d}.notice{background:#fff7e5;border-radius:10px;padding:12px;font-size:13px;line-height:1.6}select{font:inherit;padding:7px;border-radius:8px;border:1px solid #a9c5d6}#teacher{display:none}.summary{padding:9px;background:#f0f7fb;border-radius:8px;margin:8px 0;line-height:1.7}footer{text-align:center;padding:20px;color:#718392;font-size:12px}
</style></head><body><header><div style="font-size:36px">🎈</div><h1>権利の気球</h1><p>あなたは、どの権利を最後まで守りたい？</p></header><main>
<section><label>画面 <select id="mode"><option value="student">生徒用</option><option value="teacher">教師用</option></select></label>　<label>班 <select id="group"><option value="1">1班</option><option value="2">2班</option><option value="3">3班</option><option value="4">4班</option></select></label><p class="hint">動作確認版：この端末内でのみ保存。別端末との同期はまだありません。</p></section>
<div id="student"><section><h2>権利の札（10枚）</h2><p class="hint">札をタップ → 順位の枠をタップ。配置した札を押すと戻せます。</p><div id="cards" class="cards"><button type="button" class="right" data-id="0">好きな食べ物を選ぶ権利</button><button type="button" class="right" data-id="1">趣味を楽しむ権利</button><button type="button" class="right" data-id="2">休息をとる権利</button><button type="button" class="right" data-id="3">自由に発言する権利</button><button type="button" class="right" data-id="4">プライバシーを守られる権利</button><button type="button" class="right" data-id="5">教育を受ける権利</button><button type="button" class="right" data-id="6">差別されない権利</button><button type="button" class="right" data-id="7">大切な人と交流する権利</button><button type="button" class="right" data-id="8">結婚する自由</button><button type="button" class="right" data-id="9">自由に行動する権利</button></div></section>
<section><h2>班のランキング</h2><p class="hint">1位＝最後まで守りたい権利／10位＝最初に手放す権利</p><div id="slots"><button type="button" class="slot" data-pos="0"><b>1位</b><span>ここをタップして配置</span></button><button type="button" class="slot" data-pos="1"><b>2位</b><span>ここをタップして配置</span></button><button type="button" class="slot" data-pos="2"><b>3位</b><span>ここをタップして配置</span></button><button type="button" class="slot" data-pos="3"><b>4位</b><span>ここをタップして配置</span></button><button type="button" class="slot" data-pos="4"><b>5位</b><span>ここをタップして配置</span></button><button type="button" class="slot" data-pos="5"><b>6位</b><span>ここをタップして配置</span></button><button type="button" class="slot" data-pos="6"><b>7位</b><span>ここをタップして配置</span></button><button type="button" class="slot" data-pos="7"><b>8位</b><span>ここをタップして配置</span></button><button type="button" class="slot" data-pos="8"><b>9位</b><span>ここをタップして配置</span></button><button type="button" class="slot" data-pos="9"><b>10位</b><span>ここをタップして配置</span></button></div><p id="status">0 / 10 枚配置</p><div class="actions"><button class="action" id="submit">🎈 完成！ この順位で提出</button><button class="action secondary" id="reset">最初からやり直す</button></div></section></div>
<div id="teacher"><section><h2>教師用｜4班の提出結果</h2><p class="hint">この端末で提出した結果のみ表示します。</p><div id="results"></div></section></div>
<section><div class="notice">※ このファイルを開いた時点で10枚の権利札が見えるよう、札と順位枠をHTMLに直接書き込んでいます。表示されない場合はファイルプレビュー自体の制限です。</div></section>
</main><footer>権利の気球｜模擬授業用</footer><script>
(function(){
var order=[null,null,null,null,null,null,null,null,null,null],selected=null,submitted={};
var rights=['好きな食べ物を選ぶ権利', '趣味を楽しむ権利', '休息をとる権利', '自由に発言する権利', 'プライバシーを守られる権利', '教育を受ける権利', '差別されない権利', '大切な人と交流する権利', '結婚する自由', '自由に行動する権利'];
var cards=document.getElementById('cards'),slots=document.getElementById('slots');
function draw(){
 Array.prototype.forEach.call(cards.children,function(b){var id=Number(b.getAttribute('data-id'));b.classList.toggle('selected',selected===id);b.classList.toggle('used',order.indexOf(id)!==-1);});
 Array.prototype.forEach.call(slots.children,function(b,i){var v=order[i];b.classList.toggle('filled',v!==null);b.querySelector('span').textContent=v===null?'ここをタップして配置':rights[v];});
 document.getElementById('status').textContent=order.filter(function(v){return v!==null}).length+' / 10 枚配置';
}
cards.addEventListener('click',function(e){var b=e.target.closest('[data-id]');if(!b)return;var id=Number(b.getAttribute('data-id'));if(order.indexOf(id)!==-1)return;selected=selected===id?null:id;draw();});
slots.addEventListener('click',function(e){var b=e.target.closest('[data-pos]');if(!b)return;var pos=Number(b.getAttribute('data-pos'));if(order[pos]!==null){selected=order[pos];order[pos]=null;}else if(selected!==null){order[pos]=selected;selected=null;}draw();});
document.getElementById('reset').addEventListener('click',function(){order=Array(10).fill(null);selected=null;draw();});
document.getElementById('submit').addEventListener('click',function(){if(order.indexOf(null)!==-1){alert('10枚すべて配置してね！');return;}submitted[document.getElementById('group').value]=order.slice();alert('提出できたよ！ 教師用画面で確認できます（この端末のみ）。');renderTeacher();});
document.getElementById('group').addEventListener('change',function(){order=Array(10).fill(null);selected=null;draw();});
document.getElementById('mode').addEventListener('change',function(e){document.getElementById('student').style.display=e.target.value==='student'?'block':'none';document.getElementById('teacher').style.display=e.target.value==='teacher'?'block':'none';renderTeacher();});
function renderTeacher(){var r=document.getElementById('results');r.innerHTML='';for(var g=1;g<=4;g++){var d=document.createElement('div');d.className='summary';var s=submitted[g];d.textContent=g+'班：'+(s?s.map(function(id,i){return (i+1)+'位 '+rights[id]}).join(' ／ '):'未提出');r.appendChild(d);}}
draw();renderTeacher();
})();
</script></body></html>
